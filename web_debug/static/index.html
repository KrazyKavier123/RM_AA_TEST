<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RMV Debug Dashboard</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #101316;
            --surface: #181d21;
            --surface-raised: #20262b;
            --line: #30383e;
            --text: #eef2f3;
            --muted: #9ba7ad;
            --accent: #45c4b0;
            --accent-soft: #153c37;
            --warning: #e3ad4a;
            --danger: #e16b65;
            --grid: #293136;
        }

        * { box-sizing: border-box; }

        html, body { min-height: 100%; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
                "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            font-size: 14px;
            letter-spacing: 0;
        }

        button, select, input { font: inherit; }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 20px;
            min-height: 64px;
            padding: 10px 20px;
            border-bottom: 1px solid var(--line);
            background: rgba(16, 19, 22, 0.96);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: max-content;
        }

        .brand-mark {
            display: grid;
            width: 38px;
            height: 38px;
            place-items: center;
            border: 1px solid #367c72;
            border-radius: 6px;
            background: var(--accent-soft);
            color: var(--accent);
            font-size: 12px;
            font-weight: 800;
        }

        h1 {
            margin: 0;
            font-size: 16px;
            line-height: 1.25;
            letter-spacing: 0;
        }

        .subtitle {
            margin-top: 2px;
            color: var(--muted);
            font-size: 12px;
        }

        .connection {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            min-width: max-content;
            color: var(--muted);
            font-size: 12px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--warning);
        }

        .connection.online .status-dot { background: var(--accent); }
        .connection.offline .status-dot { background: var(--danger); }

        .toolbar {
            display: flex;
            flex: 1;
            flex-wrap: wrap;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
        }

        .field {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            color: var(--muted);
            font-size: 12px;
        }

        .btn, select, input[type="number"] {
            min-height: 34px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: var(--surface-raised);
            color: var(--text);
        }

        .btn {
            padding: 0 12px;
            cursor: pointer;
        }

        .btn:hover, select:hover { border-color: #526068; }
        .btn:focus-visible, select:focus-visible, input:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .btn.active {
            border-color: #367c72;
            background: var(--accent-soft);
            color: var(--accent);
        }

        select { padding: 0 28px 0 10px; }
        #customWindow { width: 90px; padding: 0 8px; }
        #customWindow:invalid { border-color: var(--danger); }
        #customWindowField[hidden] { display: none; }

        main { padding: 18px 20px 30px; }

        #charts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr));
            gap: 12px;
            align-items: start;
        }

        .chart-card {
            min-width: 0;
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: var(--surface);
        }

        .chart-header {
            display: flex;
            min-height: 46px;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 8px 10px 8px 12px;
            border-bottom: 1px solid var(--line);
        }

        .metric-info {
            display: flex;
            min-width: 0;
            align-items: baseline;
            gap: 10px;
        }

        .metric-name {
            overflow: hidden;
            color: var(--muted);
            font-size: 12px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .metric-value {
            min-width: 72px;
            color: var(--text);
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
            font-size: 15px;
            font-variant-numeric: tabular-nums;
            font-weight: 700;
        }

        .card-actions { display: flex; gap: 4px; }

        .icon-btn {
            width: 34px;
            height: 30px;
            padding: 0;
            border: 0;
            border-radius: 4px;
            background: transparent;
            color: var(--muted);
            cursor: pointer;
        }

        .icon-btn:hover { background: var(--surface-raised); color: var(--text); }
        .icon-btn:focus-visible { outline: 2px solid var(--accent); }

        .chart-wrap {
            width: 100%;
            height: 250px;
            padding: 8px;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .chart-card.collapsed .chart-wrap { display: none; }
        .chart-card.collapsed .chart-header { border-bottom: 0; }

        .empty-state {
            grid-column: 1 / -1;
            display: grid;
            min-height: 260px;
            place-items: center;
            border: 1px dashed #3a444a;
            border-radius: 6px;
            color: var(--muted);
            text-align: center;
        }

        .empty-title { color: var(--text); font-size: 15px; font-weight: 650; }
        .empty-detail { margin-top: 6px; font-size: 12px; }

        @media (max-width: 850px) {
            .topbar { align-items: flex-start; flex-wrap: wrap; }
            .connection { margin-left: auto; }
            .toolbar { flex-basis: 100%; justify-content: flex-start; }
        }

        @media (max-width: 520px) {
            .topbar, main { padding-left: 12px; padding-right: 12px; }
            .toolbar { gap: 6px; }
            .field { width: 100%; justify-content: space-between; }
            .btn { flex: 1; padding: 0 8px; }
            .chart-wrap { height: 220px; }
        }
        .link-panel {
            margin-bottom: 12px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: var(--surface);
            overflow: hidden;
        }

        .link-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 12px;
            border-bottom: 1px solid var(--line);
        }

        .link-title { font-size: 14px; font-weight: 700; color: var(--text); }
        .link-sub { margin-top: 2px; color: var(--muted); font-size: 11px; }

        .link-state {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 4px 10px;
            border: 1px solid var(--line);
            border-radius: 999px;
            color: var(--muted);
            font-size: 12px;
            white-space: nowrap;
        }

        .link-state::before {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--warning);
        }

        .link-state.ok { color: var(--accent); border-color: #367c72; background: var(--accent-soft); }
        .link-state.ok::before { background: var(--accent); }
        .link-state.bad { color: var(--danger); border-color: #5b2f2c; }
        .link-state.bad::before { background: var(--danger); }

        .link-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            padding: 8px 12px;
            border-bottom: 1px solid var(--line);
            color: var(--muted);
            font-size: 12px;
        }

        .link-meta b {
            color: var(--text);
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
            font-variant-numeric: tabular-nums;
        }

        .frame-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 1px;
            background: var(--line);
        }

        .frame-cell {
            display: flex;
            flex-direction: column;
            gap: 3px;
            min-width: 0;
            padding: 8px 12px;
            background: var(--surface);
        }

        .frame-label {
            overflow: hidden;
            color: var(--muted);
            font-size: 11px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .frame-value {
            color: var(--text);
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
            font-size: 14px;
            font-variant-numeric: tabular-nums;
        }

        .frame-caption {
            padding: 8px 12px;
            color: var(--muted);
            font-size: 11px;
            border-top: 1px solid var(--line);
        }

    </style>
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <div class="brand-mark" aria-hidden="true">RMV</div>
            <div>
                <h1>视觉调试面板</h1>
                <div class="subtitle">Real-time numeric telemetry</div>
            </div>
        </div>

        <div id="connection" class="connection connecting" role="status" aria-live="polite">
            <span class="status-dot" aria-hidden="true"></span>
            <span id="connectionText">正在连接</span>
        </div>

        <div class="toolbar">
            <label class="field" for="timeWindow">
                时间窗
                <select id="timeWindow">
                    <option value="7.5">7.5 秒</option>
                    <option value="15">15 秒</option>
                    <option value="30" selected>30 秒</option>
                    <option value="60">1 分钟</option>
                    <option value="300">5 分钟</option>
                    <option value="0">全部</option>
                    <option value="custom">自定义</option>
                </select>
            </label>
            <label class="field" id="customWindowField" for="customWindow" hidden>
                <input id="customWindow" type="number" min="0.001" step="any" value="7.5"
                       required aria-label="自定义时间窗口（秒）" title="输入大于等于0.001的秒数，支持小数；无效时保留上次有效窗口">
                秒
            </label>
            <button id="pauseButton" class="btn" type="button" aria-pressed="false">暂停</button>
            <button id="clearButton" class="btn" type="button">清空</button>
            <button id="exportButton" class="btn" type="button">导出 CSV</button>
        </div>
    </header>

    <main>
        <section class="link-panel">
            <div class="link-head">
                <div>
                    <div class="link-title">上下位机通信</div>
                    <div class="link-sub">当前写回电控的 64 字节帧</div>
                </div>
                <div id="linkState" class="link-state">等待数据</div>
            </div>
            <div class="link-meta">
                <span>收帧数 <b id="linkRxFrames">-</b></span>
                <span>最近帧龄 <b id="linkRxAge">-</b> ms</span>
            </div>
            <div class="frame-grid" id="frameGrid"></div>
            <div class="frame-caption">字段顺序与线协议一致（yaw 到 crc）。持续更新且显示“通信正常”即表明上下位机通信正常。</div>
        </section>
        <section id="charts" aria-live="polite"></section>
    </main>

    <script>
        (() => {
            "use strict";

            const MAX_HISTORY_POINTS = 5000;
            const chartsRoot = document.getElementById("charts");
            const linkState = document.getElementById("linkState");
            const linkRxFrames = document.getElementById("linkRxFrames");
            const linkRxAge = document.getElementById("linkRxAge");
            const frameGrid = document.getElementById("frameGrid");
            const connection = document.getElementById("connection");
            const connectionText = document.getElementById("connectionText");
            const pauseButton = document.getElementById("pauseButton");
            const clearButton = document.getElementById("clearButton");
            const exportButton = document.getElementById("exportButton");
            const timeWindow = document.getElementById("timeWindow");
            const customWindow = document.getElementById("customWindow");
            const customWindowField = document.getElementById("customWindowField");
            let customWindowSeconds = 7.5;

            // 每个指标名称对应一张图表，并在浏览器内维护自己的历史记录。
            const charts = new Map();
            let paused = false;
            let streamState = "connecting";
            let eventSource = null;

            function setConnectionState(state, label) {
                streamState = state;
                connection.className = `connection ${state}`;
                connectionText.textContent = label;
                updateEmptyState();
            }

            function updateEmptyState() {
                const existing = document.getElementById("emptyState");
                if (charts.size > 0 || telemetrySeen) {
                    if (existing) existing.remove();
                    return;
                }

                const empty = existing || document.createElement("div");
                empty.id = "emptyState";
                empty.className = "empty-state";
                const detail = streamState === "online"
                    ? "等待处理线程发送数值"
                    : streamState === "offline"
                        ? "数据连接已断开"
                        : "正在建立数据连接";
                empty.innerHTML = "";
                const content = document.createElement("div");
                const title = document.createElement("div");
                title.className = "empty-title";
                title.textContent = "暂无调试数据";
                const message = document.createElement("div");
                message.className = "empty-detail";
                message.textContent = detail;
                content.append(title, message);
                empty.appendChild(content);
                if (!existing) chartsRoot.appendChild(empty);
            }

            function formatValue(value) {
                const absolute = Math.abs(value);
                if (absolute !== 0 && (absolute >= 100000 || absolute < 0.001)) {
                    return value.toExponential(3);
                }
                return value.toFixed(3).replace(/\.0+$|(\.\d*?)0+$/, "$1");
            }

            // 网页要展示的"当前发信帧"字段，顺序与线协议一致（yaw 到 crc）。
            const FRAME_FIELDS = [
                ["frame.yaw", "yaw"], ["frame.pitch", "pitch"], ["frame.roll", "roll"],
                ["frame.status", "status"], ["frame.is_far", "is_far"],
                ["frame.armor_flag", "armor_flag"], ["frame.latency", "latency"],
                ["frame.bias", "bias"], ["frame.distance", "distance"],
                ["frame.pitch_offset", "pitch_offset"], ["frame.coo_x", "coo_x"],
                ["frame.coo_y", "coo_y"], ["frame.wheel_w", "wheel_w"],
                ["frame.fire_allowance", "fire_allowance"],
                ["frame.target_yaw", "target_yaw"], ["frame.target_pitch", "target_pitch"],
                ["frame.yaw_vel", "yaw_vel"], ["frame.pitch_vel", "pitch_vel"],
                ["frame.crc", "crc"],
            ];
            const frameValues = new Map();
            let telemetrySeen = false;
            for (const [key, label] of FRAME_FIELDS) {
                const cell = document.createElement("div");
                cell.className = "frame-cell";
                const name = document.createElement("div");
                name.className = "frame-label";
                name.textContent = label;
                const value = document.createElement("div");
                value.className = "frame-value";
                value.textContent = "-";
                cell.append(name, value);
                frameGrid.appendChild(cell);
                frameValues.set(key, value);
            }

            function setLinkState(state, label) {
                linkState.className = `link-state ${state}`;
                linkState.textContent = label;
            }

            // 处理链路健康与发信帧字段：只更新面板，不生成曲线。
            function applyTelemetryPoint(key, value) {
                telemetrySeen = true;
                if (key === "link.rx_frames") {
                    linkRxFrames.textContent = String(Math.trunc(value));
                    return;
                }
                if (key === "link.rx_age_ms") {
                    linkRxAge.textContent = value < 0 ? "未收到" : formatValue(value);
                    return;
                }
                if (key === "link.rx_ok") {
                    setLinkState(value >= 0.5 ? "ok" : "bad",
                        value >= 0.5 ? "通信正常" : "通信超时");
                    return;
                }
                const cell = frameValues.get(key);
                if (cell) cell.textContent = formatValue(value);
            }

            function makeChart(key) {
                const card = document.createElement("article");
                card.className = "chart-card";

                const header = document.createElement("header");
                header.className = "chart-header";
                const info = document.createElement("div");
                info.className = "metric-info";
                const name = document.createElement("span");
                name.className = "metric-name";
                name.title = key;
                name.textContent = key;
                const value = document.createElement("span");
                value.className = "metric-value";
                value.textContent = "-";
                info.append(name, value);

                const actions = document.createElement("div");
                actions.className = "card-actions";
                const csvButton = document.createElement("button");
                csvButton.type = "button";
                csvButton.className = "icon-btn";
                csvButton.title = `导出 ${key} CSV`;
                csvButton.setAttribute("aria-label", csvButton.title);
                csvButton.textContent = "CSV";
                const collapseButton = document.createElement("button");
                collapseButton.type = "button";
                collapseButton.className = "icon-btn";
                collapseButton.title = "折叠图表";
                collapseButton.setAttribute("aria-label", collapseButton.title);
                collapseButton.setAttribute("aria-expanded", "true");
                collapseButton.textContent = "v";
                actions.append(csvButton, collapseButton);
                header.append(info, actions);

                const wrap = document.createElement("div");
                wrap.className = "chart-wrap";
                const canvas = document.createElement("canvas");
                canvas.setAttribute("role", "img");
                canvas.setAttribute("aria-label", `${key} 曲线`);
                wrap.appendChild(canvas);
                card.append(header, wrap);
                chartsRoot.appendChild(card);

                const chart = { key, card, canvas, value, history: [], dirty: true };
                charts.set(key, chart);
                updateEmptyState();

                csvButton.addEventListener("click", () => exportMetric(chart));
                collapseButton.addEventListener("click", () => {
                    const collapsed = card.classList.toggle("collapsed");
                    collapseButton.textContent = collapsed ? ">" : "v";
                    collapseButton.title = collapsed ? "展开图表" : "折叠图表";
                    collapseButton.setAttribute("aria-label", collapseButton.title);
                    collapseButton.setAttribute("aria-expanded", String(!collapsed));
                    if (!collapsed) {
                        chart.dirty = true;
                        renderChart(chart);
                    }
                });
                return chart;
            }

            function appendPoint(point) {
                if (!point || typeof point.k !== "string" || point.k.length === 0) return;
                const numericValue = Number(point.v);
                const timestamp = Number(point.t);
                if (!Number.isFinite(numericValue) || !Number.isFinite(timestamp)) return;

                if (point.k.startsWith("frame.") || point.k.startsWith("link.")) {
                    applyTelemetryPoint(point.k, numericValue);
                    return;
                }

                const chart = charts.get(point.k) || makeChart(point.k);
                // 限制浏览器历史记录的长度，避免暂停或长时间运行时无限增长。
                chart.history.push({ t: timestamp, v: numericValue });
                if (chart.history.length > MAX_HISTORY_POINTS) {
                    chart.history.splice(0, chart.history.length - MAX_HISTORY_POINTS);
                }
                chart.dirty = true;
            }

            function visiblePoints(history) {
                if (history.length === 0) return history;
                const seconds = timeWindow.value === "custom"
                    ? customWindowSeconds : Number(timeWindow.value);
                if (seconds === 0) return history;
                // 时间窗口以最新样本为基准，这样回放历史数据时也能正常工作。
                const cutoff = history[history.length - 1].t - seconds * 1000;
                let first = history.length - 1;
                while (first > 0 && history[first - 1].t >= cutoff) first -= 1;
                return history.slice(first);
            }

            function renderChart(chart) {
                if (!chart.dirty || chart.card.classList.contains("collapsed")) return;
                chart.dirty = false;

                const points = visiblePoints(chart.history);
                if (chart.history.length > 0) {
                    chart.value.textContent = formatValue(chart.history[chart.history.length - 1].v);
                }

                const rect = chart.canvas.getBoundingClientRect();
                if (rect.width < 10 || rect.height < 10) return;
                const ratio = Math.min(window.devicePixelRatio || 1, 2);
                chart.canvas.width = Math.round(rect.width * ratio);
                chart.canvas.height = Math.round(rect.height * ratio);
                const ctx = chart.canvas.getContext("2d");
                ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
                ctx.clearRect(0, 0, rect.width, rect.height);

                const plot = { left: 58, top: 12, right: rect.width - 12, bottom: rect.height - 28 };
                const plotWidth = Math.max(1, plot.right - plot.left);
                const plotHeight = Math.max(1, plot.bottom - plot.top);

                if (points.length === 0) {
                    ctx.fillStyle = "#9ba7ad";
                    ctx.font = "12px system-ui, sans-serif";
                    ctx.textAlign = "center";
                    ctx.fillText("暂无数据", rect.width / 2, rect.height / 2);
                    return;
                }

                let min = points[0].v;
                let max = points[0].v;
                for (const point of points) {
                    min = Math.min(min, point.v);
                    max = Math.max(max, point.v);
                }
                const spread = max - min;
                const padding = spread === 0 ? Math.max(Math.abs(max) * 0.08, 0.5) : spread * 0.1;
                min -= padding;
                max += padding;

                ctx.strokeStyle = "#293136";
                ctx.fillStyle = "#9ba7ad";
                ctx.lineWidth = 1;
                ctx.font = "11px system-ui, sans-serif";
                ctx.textBaseline = "middle";
                for (let line = 0; line <= 4; line += 1) {
                    const y = plot.top + (plotHeight * line) / 4;
                    ctx.beginPath();
                    ctx.moveTo(plot.left, Math.round(y) + 0.5);
                    ctx.lineTo(plot.right, Math.round(y) + 0.5);
                    ctx.stroke();
                    ctx.textAlign = "right";
                    ctx.fillText(formatValue(max - ((max - min) * line) / 4), plot.left - 7, y);
                }

                const firstTime = points[0].t;
                const lastTime = points[points.length - 1].t;
                const timeSpan = Math.max(1, lastTime - firstTime);
                ctx.textBaseline = "alphabetic";
                ctx.textAlign = "left";
                ctx.fillText(new Date(firstTime).toLocaleTimeString(), plot.left, rect.height - 7);
                ctx.textAlign = "right";
                ctx.fillText(new Date(lastTime).toLocaleTimeString(), plot.right, rect.height - 7);

                // 仅对绘图数据降采样；导出的 CSV 仍保留完整的浏览器历史记录。
                const maxRenderedPoints = Math.max(100, Math.floor(plotWidth * 2));
                const step = Math.max(1, Math.ceil(points.length / maxRenderedPoints));
                ctx.beginPath();
                ctx.strokeStyle = "#45c4b0";
                ctx.lineWidth = 1.7;
                let started = false;
                for (let index = 0; index < points.length; index += step) {
                    const point = points[index];
                    const x = plot.left + ((point.t - firstTime) / timeSpan) * plotWidth;
                    const y = plot.bottom - ((point.v - min) / (max - min)) * plotHeight;
                    if (!started) {
                        ctx.moveTo(x, y);
                        started = true;
                    } else {
                        ctx.lineTo(x, y);
                    }
                }
                const last = points[points.length - 1];
                const lastX = plot.left + ((last.t - firstTime) / timeSpan) * plotWidth;
                const lastY = plot.bottom - ((last.v - min) / (max - min)) * plotHeight;
                ctx.lineTo(lastX, lastY);
                ctx.stroke();
            }

            function renderAll(force = false) {
                if (paused && !force) return;
                for (const chart of charts.values()) renderChart(chart);
            }

            function csvCell(value) {
                const text = String(value);
                return `"${text.replace(/"/g, '""')}"`;
            }

            function triggerDownload(filename, rows) {
                const blob = new Blob(["\ufeff", rows.join("\n")], {
                    type: "text/csv;charset=utf-8"
                });
                const url = URL.createObjectURL(blob);
                const anchor = document.createElement("a");
                anchor.href = url;
                anchor.download = filename;
                document.body.appendChild(anchor);
                anchor.click();
                anchor.remove();
                URL.revokeObjectURL(url);
            }

            function safeFilename(name) {
                const safe = name.replace(/[^a-zA-Z0-9_-]+/g, "_").replace(/^_+|_+$/g, "");
                return safe || "metric";
            }

            function exportMetric(chart) {
                const rows = ["timestamp,time,value"];
                for (const point of chart.history) {
                    rows.push(`${point.t},${csvCell(new Date(point.t).toISOString())},${point.v}`);
                }
                triggerDownload(`${safeFilename(chart.key)}.csv`, rows);
            }

            function exportAll() {
                const rows = ["metric,timestamp,time,value"];
                for (const chart of charts.values()) {
                    for (const point of chart.history) {
                        rows.push(`${csvCell(chart.key)},${point.t},${csvCell(new Date(point.t).toISOString())},${point.v}`);
                    }
                }
                const stamp = new Date().toISOString().replace(/[:.]/g, "-");
                triggerDownload(`rmv-debug-${stamp}.csv`, rows);
            }

            pauseButton.addEventListener("click", () => {
                paused = !paused;
                pauseButton.classList.toggle("active", paused);
                pauseButton.setAttribute("aria-pressed", String(paused));
                pauseButton.textContent = paused ? "继续" : "暂停";
                if (!paused) renderAll(true);
            });

            clearButton.addEventListener("click", () => {
                charts.clear();
                chartsRoot.replaceChildren();
                updateEmptyState();
            });

            exportButton.addEventListener("click", exportAll);
            function refreshTimeWindow() {
                for (const chart of charts.values()) chart.dirty = true;
                renderAll(true);
            }

            timeWindow.addEventListener("change", () => {
                customWindowField.hidden = timeWindow.value !== "custom";
                refreshTimeWindow();
                if (!customWindowField.hidden) customWindow.focus();
            });
            customWindow.addEventListener("input", () => {
                const seconds = customWindow.valueAsNumber;
                if (!customWindow.validity.valid || !Number.isFinite(seconds)) return;
                customWindowSeconds = seconds;
                if (timeWindow.value === "custom") refreshTimeWindow();
            });
            customWindow.addEventListener("change", () => customWindow.reportValidity());

            window.addEventListener("resize", () => {
                for (const chart of charts.values()) chart.dirty = true;
                renderAll(true);
            });

            function connect() {
                setConnectionState("connecting", "正在连接");
                // EventSource 重连时会把 Last-Event-ID 发送给服务器。
                eventSource = new EventSource("/data");
                eventSource.onopen = () => setConnectionState("online", "数据在线");
                eventSource.onmessage = (event) => {
                    try {
                        const payload = JSON.parse(event.data);
                        if (Array.isArray(payload)) payload.forEach(appendPoint);
                    } catch (error) {
                        console.warn("Invalid SSE payload", error);
                    }
                };
                eventSource.onerror = () => {
                    const closed = eventSource.readyState === EventSource.CLOSED;
                    setConnectionState(closed ? "offline" : "connecting",
                        closed ? "连接已断开" : "正在重连");
                };
            }

            window.addEventListener("beforeunload", () => {
                if (eventSource) eventSource.close();
            });

            updateEmptyState();
            connect();
            window.setInterval(() => renderAll(false), 100);
        })();
    </script>
</body>
</html>
